<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 182" width="900" height="182" role="img" aria-label="Mühendislik yaklaşımım">
  <title>Mühendislik yaklaşımım</title>
  <defs><clipPath id="c"><rect width="900" height="182" rx="12"/></clipPath></defs>
  <g clip-path="url(#c)">
    <rect width="900" height="182" fill="#0d1117"/>

    <text x="24" y="34" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#58a6ff" letter-spacing="0.4">Mühendislik yaklaşımım</text>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.140;0.240;1" dur="2.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 8;0 8;0 0;0 0" keyTimes="0;0.140;0.240;1" dur="2.2s" fill="freeze"/>
      <text x="24" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#58a6ff" letter-spacing="1">01</text>
      <rect x="24" y="84" width="0" height="2" rx="1" fill="#58a6ff" opacity="0.75">
        <animate attributeName="width" values="0;0;159;159" keyTimes="0;0.140;0.490;1" dur="2.2s" fill="freeze"/>
      </rect>
      <text x="24" y="104" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#e6edf3">Uçtan uca tasarım</text>
      <text x="24" y="118" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">Veri şeması, API sözleşmesi</text>
      <text x="24" y="136" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">ve arayüz tek bütün olarak</text>
      <text x="24" y="154" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">tasarlanır.</text>
    </g>
    <line x1="232" y1="62" x2="232" y2="160" stroke="#21262d">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.350;1" dur="2.2s" fill="freeze"/>
    </line>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.350;1" dur="2.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 8;0 8;0 0;0 0" keyTimes="0;0.250;0.350;1" dur="2.2s" fill="freeze"/>
      <text x="241" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#3fb950" letter-spacing="1">02</text>
      <rect x="241" y="84" width="0" height="2" rx="1" fill="#3fb950" opacity="0.75">
        <animate attributeName="width" values="0;0;159;159" keyTimes="0;0.250;0.600;1" dur="2.2s" fill="freeze"/>
      </rect>
      <text x="241" y="104" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#e6edf3">Üretime hazır</text>
      <text x="241" y="118" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">Kimlik doğrulama, ödeme,</text>
      <text x="241" y="136" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">izlenebilirlik ve Docker ile</text>
      <text x="241" y="154" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">dağıtım dahil teslim edilir.</text>
    </g>
    <line x1="449" y1="62" x2="449" y2="160" stroke="#21262d">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.360;0.460;1" dur="2.2s" fill="freeze"/>
    </line>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.360;0.460;1" dur="2.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 8;0 8;0 0;0 0" keyTimes="0;0.360;0.460;1" dur="2.2s" fill="freeze"/>
      <text x="458" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#a371f7" letter-spacing="1">03</text>
      <rect x="458" y="84" width="0" height="2" rx="1" fill="#a371f7" opacity="0.75">
        <animate attributeName="width" values="0;0;159;159" keyTimes="0;0.360;0.710;1" dur="2.2s" fill="freeze"/>
      </rect>
      <text x="458" y="104" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#e6edf3">Gerekçeli karar</text>
      <text x="458" y="118" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">Her teknoloji seçimi bir</text>
      <text x="458" y="136" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">ödünleşimle savunulur;</text>
      <text x="458" y="154" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">ölçmeden optimize edilmez.</text>
    </g>
    <line x1="666" y1="62" x2="666" y2="160" stroke="#21262d">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.470;0.570;1" dur="2.2s" fill="freeze"/>
    </line>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.470;0.570;1" dur="2.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 8;0 8;0 0;0 0" keyTimes="0;0.470;0.570;1" dur="2.2s" fill="freeze"/>
      <text x="675" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#d29922" letter-spacing="1">04</text>
      <rect x="675" y="84" width="0" height="2" rx="1" fill="#d29922" opacity="0.75">
        <animate attributeName="width" values="0;0;159;159" keyTimes="0;0.470;0.820;1" dur="2.2s" fill="freeze"/>
      </rect>
      <text x="675" y="104" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#e6edf3">Otomasyon</text>
      <text x="675" y="118" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">Tekrar eden işler CI/CD ve</text>
      <text x="675" y="136" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">test otomasyonuna devredilir.</text>
    </g>
    <rect x="0.5" y="0.5" width="899" height="181" rx="12" fill="none" stroke="#21262d"/>
  </g>
</svg>
