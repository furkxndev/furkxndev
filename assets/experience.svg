<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 256" width="900" height="256" role="img" aria-label="Deneyim ve eğitim">
  <title>Deneyim ve eğitim</title>
  <defs><clipPath id="c"><rect width="900" height="256" rx="12"/></clipPath></defs>
  <g clip-path="url(#c)">
    <rect width="900" height="256" fill="#0d1117"/>

    <line x1="44" y1="30" x2="44" y2="222" stroke="#21262d" stroke-width="2"
          stroke-dasharray="192" stroke-dashoffset="192">
      <animate attributeName="stroke-dashoffset" values="192;0;0" keyTimes="0;0.42;1" dur="2.2s" fill="freeze"/>
    </line>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.350;1" dur="2.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 8;0 8;0 0;0 0" keyTimes="0;0.250;0.350;1" dur="2.2s" fill="freeze"/>
      <circle cx="44" cy="52" r="7" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
      <circle cx="44" cy="52" r="3" fill="#3fb950"/>
      <circle cx="44" cy="52" r="7" fill="none" stroke="#3fb950" stroke-width="1.3">
        <animate attributeName="r" values="7;17;17" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <text x="70" y="50" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#e6edf3">Viofun</text>
      <text x="70" y="70" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">Bilgisayar Mühendisliği Stajyeri</text>
      <text x="876" y="56" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#3fb950">Ağu 2026 — devam ediyor</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.390;0.490;1" dur="2.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 8;0 8;0 0;0 0" keyTimes="0;0.390;0.490;1" dur="2.2s" fill="freeze"/>
      <circle cx="44" cy="126" r="7" fill="#0d1117" stroke="#8b949e" stroke-width="2"/>
      <circle cx="44" cy="126" r="3" fill="#8b949e"/>
      <text x="70" y="124" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#e6edf3">Moon Workshop</text>
      <text x="70" y="144" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">Bilgisayar Mühendisliği Stajyeri</text>
      <text x="876" y="130" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#6e7681">Tem 2025 — Ağu 2025</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.530;0.630;1" dur="2.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 8;0 8;0 0;0 0" keyTimes="0;0.530;0.630;1" dur="2.2s" fill="freeze"/>
      <circle cx="44" cy="200" r="7" fill="#0d1117" stroke="#a371f7" stroke-width="2"/>
      <circle cx="44" cy="200" r="3" fill="#a371f7"/>
      <text x="70" y="198" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#e6edf3">Fırat Üniversitesi</text>
      <text x="70" y="218" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">Bilgisayar Mühendisliği, Lisans</text>
      <text x="876" y="204" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#6e7681">Eki 2023 — Eki 2027</text>
    </g>
    <rect x="0.5" y="0.5" width="899" height="255" rx="12" fill="none" stroke="#21262d"/>
  </g>
</svg>
