name: Statik kartları yenile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build-cards.mjs"
      - ".github/workflows/cards.yml"

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Kartları üret
        run: node scripts/build-cards.mjs

      - name: Değişiklik varsa işle
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "Değişiklik yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: statik kartları yenile"
          git push
