name: İstatistik kartlarını yenile

on:
  schedule:
    # Her gün 03:20 UTC
    - cron: "20 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build-stats.mjs"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Kartları üret
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-stats.mjs "${{ github.repository_owner }}"

      - name: Değişiklik varsa işle
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "Değişiklik yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: istatistik kartlarını yenile"
          git push
